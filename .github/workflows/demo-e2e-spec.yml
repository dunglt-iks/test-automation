# Chạy đúng luồng của templates/workflows/e2e-spec.yml trên dự án mẫu (examples/demo),
# với action lấy từ chính repo này thay vì checkout .taf. PR đụng examples/demo/** sẽ chạy.
name: Demo — E2E spec

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
    paths: ["examples/demo/**"]

concurrency:
  group: demo-e2e-spec-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.detect.outputs.features }}
      has_features: ${{ steps.detect.outputs.has_features }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        uses: ./actions/detect
        with:
          root: examples/demo

  gate:
    needs: detect
    if: needs.detect.outputs.has_features == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/gate
        with:
          root: examples/demo
          features: ${{ needs.detect.outputs.features }}

  e2e:
    needs: [detect, gate]
    if: needs.detect.outputs.has_features == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/demo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: TAF ở <root>/.taf
        run: ln -s ../.. .taf
      - uses: ./actions/generate
        with:
          root: examples/demo
          features: ${{ needs.detect.outputs.features }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Cài phụ thuộc (phần của dự án)
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - id: run
        uses: ./actions/run
        with:
          root: examples/demo
          target: ci
          features: ${{ needs.detect.outputs.features }}
          artifact: demo-pr-${{ github.event.pull_request.number }}
          fail-on-test-failure: 'false'
      - id: report
        if: always() && steps.run.outcome == 'success'
        uses: ./actions/report
        with:
          root: examples/demo
          target: ci
          features: ${{ needs.detect.outputs.features }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Kết quả
        if: steps.report.outputs.failed != '0'
        run: |
          echo "::error::Còn ${{ steps.report.outputs.failed }} test e2e fail — xem comment trên PR"
          exit 1
