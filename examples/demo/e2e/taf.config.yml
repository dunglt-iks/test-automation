# Cấu hình TAF của dự án mẫu. Xem ../../../docs/01-architecture.md §4.
# Đường dẫn tính từ gốc dự án (examples/demo). Khoá trùng mặc định vẫn ghi ra để dễ đọc.
version: 1

spec:
  adapter: prd-fsd
  roots: [docs/features]
  approvedValue: Đã duyệt

testcases:
  dir: e2e/testcases
  labels: vi
  personas: e2e/personas.yml

scripts:
  dir: e2e/scripts
  ext: .spec.mjs
  guide: e2e/TAF-GUIDE.md
  allowedPaths:
    - e2e/testcases/**
    - e2e/scripts/**
    - e2e/pages/**
  forbid:
    - 'page\.locator\('
    - 'page\.getBy'
    - 'waitForTimeout\('
    - 'from ["'']@playwright/test'
  lint: for f in e2e/scripts/*.spec.mjs e2e/pages/*.mjs; do node --check "$f" || exit 1; done
  verifyTarget: ci

run:
  report: e2e/test-results/results.json
  targets:
    ci:                                # app dựng tạm: start/stop của dự án
      start: bash ci/app-up.sh
      stop: bash ci/app-down.sh
      test: npx playwright test --reporter=json,list {files}
      logs: [ci/logs/*.log]
    local:                             # app đã chạy sẵn (node app/server.mjs)
      test: npx playwright test --reporter=json,list {files}

trigger:
  codePaths: [app/**]

gate:
  blockedLabel: e2e-blocked

tracker:
  adapter: github
  labels: [bug, e2e, demo]
