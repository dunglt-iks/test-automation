<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Đơn hàng demo</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f5f7; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  form { background: #fff; padding: 24px; border-radius: 8px; width: 300px; box-shadow: 0 1px 4px #0002; }
  label { display: block; margin: 12px 0 4px; } input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 16px; width: 100%; padding: 10px; background: #2563eb; color: #fff; border: 0; border-radius: 4px; }
  .err { color: #b91c1c; margin-top: 8px; min-height: 1em; }
</style>
</head>
<body>
<form id="f">
  <h1>Đăng nhập</h1>
  <label for="login">Tên đăng nhập</label><input id="login" name="login" autocomplete="username">
  <label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password">
  <button type="submit">Đăng nhập</button>
  <div class="err" role="alert" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ login: login.value, password: password.value }) });
  if (r.ok) location.href = '/orders';
  else document.getElementById('err').textContent = (await r.json()).error;
});
</script>
</body>
</html>
