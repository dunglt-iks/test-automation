<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đơn hàng</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; background: #1e293b; color: #fff; }
  header button { background: none; border: 1px solid #fff6; color: #fff; padding: 4px 10px; border-radius: 4px; }
  main { padding: 24px; }
  .bar { display: flex; gap: 12px; margin-bottom: 16px; }
  .bar input { flex: 1; padding: 8px; }
  a.btn, button.primary { background: #2563eb; color: #fff; padding: 8px 14px; border-radius: 4px; text-decoration: none; border: 0; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
  td.num, th.num { text-align: right; }
  .empty { background: #fff; padding: 40px; text-align: center; color: #6b7280; }
  .toast { position: fixed; right: 24px; bottom: 24px; background: #16a34a; color: #fff; padding: 10px 16px; border-radius: 4px; }
  .modal { position: fixed; inset: 0; background: #0006; display: grid; place-items: center; }
  .modal > div { background: #fff; padding: 20px; border-radius: 8px; min-width: 280px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  button.danger { background: #dc2626; color: #fff; border: 0; padding: 6px 12px; border-radius: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><strong>Đơn hàng demo</strong><span><span id="me" data-testid="current-user"></span> <button id="logout">Đăng xuất</button></span></header>
<main>
  <h1>Đơn hàng</h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Tìm khách hàng" aria-label="Tìm khách hàng" data-testid="orders-search">
    <a class="btn" href="/orders/new" data-testid="orders-add">+ Tạo đơn</a>
  </div>
  <div class="empty" id="empty" data-testid="orders-empty" hidden></div>
  <table id="table" data-testid="orders-table" hidden>
    <thead><tr><th>Mã</th><th>Khách hàng</th><th>Sản phẩm</th><th class="num">SL</th><th class="num">Đơn giá</th><th class="num">CK</th><th class="num">Thành tiền</th><th class="owner">Người tạo</th><th class="act">Thao tác</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<div class="modal" id="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title" hidden>
  <div><h2 id="confirm-title"></h2><p>Đơn đã xoá không khôi phục được.</p>
  <div class="actions"><button id="cancel">Huỷ</button><button class="danger" id="ok">Xoá</button></div></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const money = (n) => new Intl.NumberFormat('vi-VN').format(n);
let me = null, pendingDelete = null, timer = null;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(timer); timer = setTimeout(() => t.hidden = true, 4000); }
async function load() {
  const q = document.getElementById('q').value.trim();
  const list = await (await fetch('/api/orders?q=' + encodeURIComponent(q))).json();
  const empty = document.getElementById('empty'), table = document.getElementById('table');
  const manager = me.role === 'manager';
  table.querySelectorAll('th.owner, th.act').forEach(el => el.hidden = !manager);
  if (!list.length) {
    table.hidden = true; empty.hidden = false;
    empty.textContent = q ? 'Không tìm thấy đơn phù hợp' : 'Chưa có đơn hàng';
    return;
  }
  empty.hidden = true; table.hidden = false;
  table.querySelector('tbody').innerHTML = list.map(o => `
    <tr data-testid="order-row-${o.id}">
      <td>#${o.id}</td><td>${o.customer.replace(/</g, '&lt;')}</td><td>${o.product.replace(/</g, '&lt;')}</td>
      <td class="num">${o.qty}</td><td class="num">${money(o.price)}</td><td class="num">${o.discount}%</td>
      <td class="num" data-testid="order-total-${o.id}">${money(o.total)}</td>
      ${manager ? `<td>${o.owner}</td><td><button class="danger" data-del="${o.id}">Xoá</button></td>` : ''}
    </tr>`).join('');
}
document.addEventListener('click', (e) => {
  const id = e.target.dataset?.del;
  if (id) { pendingDelete = id; document.getElementById('confirm-title').textContent = `Xoá đơn #${id}?`; document.getElementById('confirm').hidden = false; }
});
document.getElementById('cancel').onclick = () => { document.getElementById('confirm').hidden = true; };
document.getElementById('ok').onclick = async () => {
  document.getElementById('confirm').hidden = true;
  const r = await fetch('/api/orders/' + pendingDelete, { method: 'DELETE' });
  toast(r.ok ? `Đã xoá đơn #${pendingDelete}` : (await r.json()).error);
  load();
};
document.getElementById('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login'; };
let debounce;
document.getElementById('q').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(load, 200); });
(async () => {
  me = await (await fetch('/api/me')).json();
  document.getElementById('me').textContent = me.name;
  const created = new URLSearchParams(location.search).get('created');
  if (created) { toast(`Đã tạo đơn #${created}`); history.replaceState(null, '', '/orders'); }
  load();
})();
</script>
</body>
</html>
